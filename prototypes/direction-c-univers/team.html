<!-- No page-specific CSS — the .textpage template in sub.css, same as Manifesto / Mission / NBO CV.
     Text: content/team.md (verbatim pull, nobordersorchestra.org/team/, 2026-06-18) — six credits,
     no source headings. A credit is the role UNDER the name, in the site's micro-caps label — the
     name is the thing at full size, the role is annotation welded up to it.

     ⚠️ THE TWO PORTRAITS ARE NOT A MATCHED PAIR, and the size is set by the weaker file:
       premil.jpg      567×850, 191K — a three-quarter studio portrait, light grey ground.
       B-Fehlmann.jpg  170×170,  10K — a tight head-and-shoulders crop on a dark ground.
     At 177px (the rail's own width) Fehlmann is already at 1:1 and is soft on any retina screen;
     anything larger visibly upscales him. A bigger Fehlmann file — or better, two portraits shot to
     the same framing and ground — is what would let these grow.

     ⚠️ PREMIL'S CROP IS ZOOMED ON PURPOSE — background-size:150%, not `cover` (Premil, 2026-07-31).
     Framed at `cover` he was shot from below the waist and read as standing far back while Fehlmann's
     tight crop read as pressed against the lens; his own words were that he was "suvišno udaljen" and
     Fehlmann "preblizno". 150% cuts him at the chest and brings his head to ~38% of the frame against
     Fehlmann's ~40% — near-matched, while the remaining sliver of grey keeps him from going all the way
     to the framing he called too close. He is the ONLY portrait on the site with a background-size:
     the eight on Board are square files in a square cell, where there is nothing to steer.
     Quality is unaffected: 150% renders the 567px source at 266 CSS px, still a downscale. -->
</head>
