<!-- No page-specific CSS — the .textpage template in sub.css, and the portrait is Team's own .pcell.
     Text: content/board.md (verbatim pull, nobordersorchestra.org/board/, 2026-06-18).
     Two source headings — NBO Board · Advisory Council. Only ONE of the nine people carries a role
     in the source, so the President takes a grey credit line and everyone else is name-only;
     inventing titles for the rest is not ours to do.

     PORTRAITS — eight of them, pulled by pull-board-photos.py into fotografije/board/.
     The 2026-06-18 pull was text-only, so this page shipped as a name list while the photos sat on
     the client's page all along. Re-run that script to refresh; never hand-edit the files.
     ⚠️ SEVEN ARE 170px ORIGINALS on the client's server — not crops we chose. That is the whole
     reason a portrait belongs in the RAIL here: .pcell caps at 177px, so every one of these renders
     at 1:1 and none is upscaled. A 4-across grid (.pgrid, 228px) would stretch all seven.
     Only Deventer carries more (3280px original, shipped at the 600px web size).
     ⚠️ NO INLINE background-position, unlike Team: all eight uploads are already SQUARE and .pcell
     .img is aspect-ratio:1, so at `cover` there is no crop to steer. Team needs per-photo positions
     only because premil.jpg is 567×850. If a replacement portrait arrives non-square, it needs one.
     ⚠️ EIGHT PEOPLE, not the nine in content/board.md. Dr. Nevenka Tromp was in the 06-18 pull and
     is now absent from every page of the client's site — checked 2026-07-31 across home, board, team,
     mission, manifesto, partners, supporters. She has left the Advisory Council, so she is off this
     page. Do not restore her from board.md; that file is the June pull, not the current board.
     (.pcell would have held a photo-less name on the same text edge if we ever need one.) -->

</head>
